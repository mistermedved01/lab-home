apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner
  namespace: gitlab-runner-qwe
  labels:
    app: gitlab-runner-qwe
    environment: qwe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner
  namespace: gitlab-runner-qwe
  labels:
    app: gitlab-runner-qwe
    environment: qwe
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/attach
      - pods/log
      - secrets
      - configmaps
      - services
      - serviceaccounts
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner
  namespace: gitlab-runner-qwe
  labels:
    app: gitlab-runner-qwe
    environment: qwe
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: gitlab-runner-qwe
roleRef:
  kind: Role
  name: gitlab-runner
  apiGroup: rbac.authorization.k8s.io
