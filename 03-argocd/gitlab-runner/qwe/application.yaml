---
# ArgoCD Application для GitLab Runner для группы PROJECT/QWE
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-runner-qwe
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/mistermedved01/lab-home.git
    targetRevision: main
    path: 03-argocd/gitlab-runner/qwe

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab-runner-qwe

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
