---
# One-time Bootstrap Job: extract ApiKey from Radarr/Prowlarr config.xml and write to Secret buildarr-secrets.
# Run manually after first deploy of Radarr and Prowlarr (e.g. kubectl create job -n radarr bootstrap-run --from=cronjob/media-stack-bootstrap or apply this Job once).
# Requires: radarr-config PVC (same node as Radarr pod if RWO), Prowlarr running in prowlarr namespace.
apiVersion: batch/v1
kind: Job
metadata:
  name: media-stack-bootstrap
  namespace: radarr
  labels:
    app: media-stack-bootstrap
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=false
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: media-stack-bootstrap
    spec:
      serviceAccountName: media-stack-bootstrap
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-services
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Radarr and Prowlarr HTTP..."
              for i in $(seq 1 60); do
                if curl -sf http://radarr.radarr.svc.cluster.local:80/ping >/dev/null && \
                   curl -sf http://prowlarr.prowlarr.svc.cluster.local:80/ping >/dev/null; then
                  echo "Services ready."
                  exit 0
                fi
                sleep 5
              done
              echo "Timeout waiting for services"
              exit 1
      containers:
        - name: bootstrap
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              cp /scripts/bootstrap.sh /tmp/bootstrap.sh
              chmod +x /tmp/bootstrap.sh
              /tmp/bootstrap.sh
          env:
            - name: RADARR_CONFIG_MOUNT
              value: /config-radarr
            - name: BUILDARR_SECRET_NAME
              value: buildarr-secrets
          volumeMounts:
            - name: radarr-config
              mountPath: /config-radarr
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config
            readOnly: true
        - name: script
          configMap:
            name: media-stack-bootstrap-script
            defaultMode: 0755
