---
# Bootstrap Job: extracts ApiKey from Radarr/Prowlarr config.xml and writes to Secret buildarr-secrets.
# Run Job manually after first deploy of Radarr and Prowlarr (see README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base/rbac.yaml
  - base/configmap-script.yaml
  - base/job.yaml

commonLabels:
  app: media-stack-bootstrap
  managed-by: argocd
