---
# buildarr.yml - main config (no secrets). api_key for prowlarr/radarr in buildarr-secret.yml (from Secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildarr-config
  namespace: radarr
  labels:
    app: buildarr
data:
  buildarr.yml: |
    ---
    includes:
      - buildarr-secret.yml

    buildarr:
      watch_config: false
      update_days: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
      update_times: ["03:00"]

    prowlarr:
      hostname: prowlarr.prowlarr.svc.cluster.local
      port: 80
      protocol: "http"
      settings: {}

    radarr:
      hostname: radarr.radarr.svc.cluster.local
      port: 80
      protocol: "http"
      settings: {}
