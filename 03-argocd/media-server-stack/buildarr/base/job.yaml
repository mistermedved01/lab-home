---
# Buildarr Job: runs `buildarr run` to apply buildarr.yml to Prowlarr and Radarr.
# Requires Secret buildarr-secrets with key buildarr-secret.yml (created by bootstrap Job or manually).
# Run manually after config changes or on schedule via CronJob.
apiVersion: batch/v1
kind: Job
metadata:
  name: buildarr-run
  namespace: radarr
  labels:
    app: buildarr
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=false
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: buildarr
    spec:
      restartPolicy: OnFailure
      containers:
        - name: buildarr
          image: callum027/buildarr:latest
          workingDir: /config
          command:
            - buildarr
            - run
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: buildarr-config
              - secret:
                  name: buildarr-secrets
                  items:
                    - key: buildarr-secret.yml
                      path: buildarr-secret.yml
