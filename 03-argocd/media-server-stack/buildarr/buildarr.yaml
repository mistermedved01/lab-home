---
# ArgoCD Application: Buildarr Job
# Applies buildarr.yml to Prowlarr and Radarr. Requires Secret buildarr-secrets (run bootstrap first or create manually).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buildarr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/mistermedved01/lab-home.git
    targetRevision: HEAD
    path: 03-argocd/media-server-stack/buildarr
  destination:
    server: https://kubernetes.default.svc
    namespace: radarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
