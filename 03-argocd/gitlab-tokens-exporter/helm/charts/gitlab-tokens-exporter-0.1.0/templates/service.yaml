apiVersion: v1
kind: Service
metadata:
  name: gitlab-tokens-exporter
  namespace: {{ include "gitlab-tokens-exporter.namespace" . }}
  labels:
    {{- include "gitlab-tokens-exporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gitlab-tokens-exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
