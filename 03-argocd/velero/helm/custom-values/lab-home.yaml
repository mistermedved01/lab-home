# Velero values для lab-home (MinIO S3). Чарт: helm/charts/velero-8.6.0

# Образ kubectl для Job upgrade-crds: нужен образ на glibc (Debian), иначе /tmp/kubectl из init
# не запустится в контейнере velero (Alpine/musl несовместим). Bitnami публичный.
# Теги на Docker Hub: latest (работает), версионные типа 1.32.4-0 могут отличаться/переименованы.
# https://hub.docker.com/r/bitnami/kubectl/tags
kubectl:
  image:
    repository: docker.io/bitnami/kubectl
    tag: "latest"

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-backup
      default: true
      config:
        region: minio
        s3Url: https://minio-tenant-hl.minio-operator.svc.cluster.local:9000
        s3ForcePathStyle: "true"
        insecureSkipTLSVerify: "true"
      credential:
        name: velero-cloud-credentials
        key: cloud
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: true

credentials:
  useSecret: true
  existingSecret: velero-cloud-credentials

deployNodeAgent: true
snapshotsEnabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
