---
# ArgoCD Application: Zalando Postgres Operator (Patroni/Spilo)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://github.com/mistermedved01/lab-home.git
      path: 03-argocd/postgres-operator/manifests
      targetRevision: main
    - repoURL: https://github.com/mistermedved01/lab-home.git
      path: 03-argocd/postgres-operator/helm/charts/postgres-operator-1.13.0
      targetRevision: main
      helm:
        releaseName: postgres-operator
        valueFiles:
          - $values/03-argocd/postgres-operator/helm/custom-values/lab-home.yaml
    - repoURL: https://github.com/mistermedved01/lab-home.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: postgres-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
