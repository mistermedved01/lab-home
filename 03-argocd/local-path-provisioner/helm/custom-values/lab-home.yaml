# Local Path Provisioner values for lab-home.
storageClass:
  create: true
  name: local-path
  defaultClass: true
  defaultVolumeType: local
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer

nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
      - /opt/local-path-provisioner
