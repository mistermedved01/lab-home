# Rancher values для окружения lab-home (чарт helm/charts/rancher-2.13.0)
#
# Паттерн как у Harbor/Nexus: TLS на Ingress, cert-manager (ClusterIssuer selfsigned-issuer).
# Порт 30443 задаётся у ingress-nginx (NodePort), в values не дублируем.
#
# CATTLE_SERVER_URL — канонический адрес для UI и команд регистрации кластеров (с портом, если снаружи только NodePort).
# ingress.tls.source: secret + extraAnnotations cluster-issuer — выпуск Secret rancher-tls делает cert-manager.

hostname: rancher.lab-home.com
replicas: 1

tls: ingress

ingress:
  enabled: true
  ingressClassName: nginx
  tls:
    source: secret
    secretName: rancher-tls
  extraAnnotations:
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

# Чарт Rancher не ставит cert-manager — кластерный экземпляр из 03-argocd/cert-manager
certmanager:
  enabled: false
certManager:
  enabled: false

antiAffinity: preferred

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

useBundledSystemChart: true

extraEnv:
  - name: CATTLE_SERVER_URL
    value: https://rancher.lab-home.com:30443

global:
  cattle:
    ssl:
      fqdn: rancher.lab-home.com

telemetry:
  enabled: false
