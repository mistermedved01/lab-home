# Rancher values для окружения lab-home (чарт helm/charts/rancher-2.13.0)

hostname: rancher.lab-home.com
replicas: 1

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    # cert-manager: чарт сам добавит cert-manager.io/issuer → Issuer «rancher» в cattle-system
    # CA из секрета tls-rancher. ClusterIssuer selfsigned-issuer сюда не подмешиваем — будет конфликт по смыслу.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    # rancher: серт для Ingress выпускает cert-manager от CA Rancher (tls-rancher); секрет по умолчанию tls-rancher-ingress
    source: rancher

# Используем внешний cert-manager (не встроенный в чарт)
certmanager:
  enabled: false
certManager:
  enabled: false

antiAffinity: preferred

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

useBundledSystemChart: true

# HTTPS и FQDN
extraEnv:
  - name: CATTLE_SERVER_URL
    value: https://rancher.lab-home.com

global:
  cattle:
    ssl:
      fqdn: rancher.lab-home.com

telemetry:
  enabled: false
