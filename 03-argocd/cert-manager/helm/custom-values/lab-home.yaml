# cert-manager values для окружения lab-home (чарт helm/charts/cert-manager-1.16.0)
# Устанавливаем CRDs автоматически
installCRDs: true

# Количество реплик для основного контроллера
replicaCount: 1

# Ресурсы кластера
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Настройки веб-хука
webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Настройки cainjector
cainjector:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
