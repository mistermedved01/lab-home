---
# ClusterIssuer для self-signed сертификатов
# Используется для тестовой среды, не требует доступа к интернету
#
# ClusterIssuer - конфигурационный ресурс cert-manager для генерации TLS сертификатов.
#
# Применение: после развёртывания cert-manager выполните:
#   kubectl apply -f 03-argocd/cert-manager/clusterissuer-selfsigned.yaml
#
# Для приложений с Ingress используйте аннотацию:
#   cert-manager.io/cluster-issuer: "selfsigned-issuer"
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
