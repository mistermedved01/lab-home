apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: psql-grafana
  namespace: prometheus-stack
  labels:
    app.kubernetes.io/part-of: prometheus-stack
    app.kubernetes.io/component: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  teamId: "lab"
  numberOfInstances: 1
  dockerImage: ghcr.io/zalando/spilo-16:3.3-p3
  postgresql:
    version: "16"
    parameters:
      shared_buffers: 256MB
      log_destination: stderr
      logging_collector: "off"
  volume:
    size: 1Gi
    storageClass: topolvm-provisioner
  users:
    grafana:
      - login
      - createdb
  databases:
    grafana: grafana
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  additionalVolumes:
    - name: minio-ca
      mountPath: /etc/ssl/minio
      targetContainers:
        - postgres
      volumeSource:
        secret:
          secretName: minio-s3-ca
          items:
            - key: ca.crt
              path: ca.crt
