---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://github.com/mistermedved01/lab-home.git
      path: 03-argocd/prometheus-stack/manifests
      targetRevision: main
    - repoURL: https://github.com/mistermedved01/lab-home.git
      path: 03-argocd/prometheus-stack/helm/charts/kube-prometheus-stack-81.6.0
      targetRevision: main
      helm:
        releaseName: prometheus-stack
        valueFiles:
          - $values/03-argocd/prometheus-stack/helm/custom-values/lab-home.yaml
    - repoURL: https://github.com/mistermedved01/lab-home.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus-stack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - SkipCRDs=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m