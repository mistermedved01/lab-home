# Устарело: используйте gitlab-s3-cfg.example.yaml (ключи connection + s3cmd).
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-s3-cfg
  namespace: gitlab-test
type: Opaque
stringData:
  config: |
    [default]
    access_key = <ACCESS_KEY>
    secret_key = <SECRET_KEY>
    bucket_location = us-east-1
    host_base = <MINIO_HOST>
    host_bucket = <MINIO_HOST>/%(bucket)
    use_https = True
    check_ssl_certificate = False