---
# ArgoCD Application: GitLab TEST (стек как prod ecpk: chart 7.11 + GitLab 16.4.1 + PG16)
# namespace: gitlab-test, host: https://gitlab-test.lab-home.com
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/mistermedved01/lab-home.git
    path: 03-argocd/gitlab/helm/charts/gitlab-7.11.0
    targetRevision: main
    helm:
      releaseName: gitlab
      valueFiles:
        - ../../custom-values/lab-home-test.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
