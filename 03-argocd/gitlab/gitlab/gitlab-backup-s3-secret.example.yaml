# Пример Secret для бэкапов GitLab в S3/MinIO.
# Скопируйте в gitlab-backup-s3-secret.yaml, подставьте свои значения и примените:
#   kubectl apply -f 03-argocd/gitlab/gitlab/gitlab-backup-s3-secret.yaml
#
# Рекомендация: из кластера использовать внутренний сервис MinIO (HTTP, без Ingress):
#   host_base = minio-tenant-hl.minio-operator.svc.cluster.local:9000
#   use_https = False
# Через Ingress (minio.lab-home.com) возможны 404/маршрутизация не в MinIO и проблемы с SSL.
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-backup-s3-config
  namespace: gitlab
type: Opaque
stringData:
  config: |
    [default]
    access_key = <ACCESS_KEY>
    secret_key = <SECRET_KEY>
    bucket_location = us-east-1
    host_base = <MINIO_HOST>
    host_bucket = <MINIO_HOST>/%(bucket)
    use_https = True
    check_ssl_certificate = False
