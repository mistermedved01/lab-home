---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-s3-cfg-backup
  namespace: gitlab
type: Opaque
stringData:
  s3cmd: |
    [default]
    access_key = <ACCESS_KEY>
    secret_key = <SECRET_KEY>
    bucket_location = us-east-1
    host_base = minio.lab-home.com
    host_bucket = minio.lab-home.com/%(bucket)
    use_https = True
    check_ssl_certificate = False
