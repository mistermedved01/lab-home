# GitLab values для окружения lab-home (чарт helm/charts/gitlab-9.7.1)

# === ОСНОВНЫЕ НАСТРОЙКИ ===
installCertmanager: false

upgradeCheck:
  enabled: false

nginx-ingress:
  enabled: false

prometheus:
  install: false

registry:
  enabled: false

gitlab-runner:
  install: false

# === GLOBAL ===
global:
  hosts:
    domain: lab-home.com
    https: true
  ingress:
    configureCertmanager: false
    class: nginx
    annotations:
      cert-manager.io/cluster-issuer: "selfsigned-issuer"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      enabled: true

  kas:
    enabled: false

  appConfig:
    # Object storage в MinIO (как gitlab-c1 prod): Secret gitlab-s3-cfg, ключ connection
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-s3-cfg
        key: connection
      createBucketsJob:
        enabled: false
    lfs:
      enabled: true
      proxy_download: true
      bucket: gitlab-lab-home-lfs
      connection: {}
    artifacts:
      enabled: true
      proxy_download: true
      bucket: gitlab-lab-home-artifacts
      connection: {}
    uploads:
      enabled: true
      proxy_download: true
      bucket: gitlab-lab-home-uploads
      connection: {}
    packages:
      enabled: true
      proxy_download: true
      bucket: gitlab-lab-home-packages
      connection: {}
    externalDiffs:
      enabled: true
      when: outdated
      proxy_download: true
      bucket: gitlab-lab-home-mr-diffs
      connection: {}
    terraformState:
      enabled: true
      bucket: gitlab-lab-home-terraform-state
      connection: {}
    ciSecureFiles:
      enabled: true
      bucket: gitlab-lab-home-ci-secure-files
      connection: {}
    dependencyProxy:
      enabled: true
      proxy_download: true
      bucket: gitlab-lab-home-dependency-proxy
      connection: {}
    backups:
      bucket: gitlab-lab-home-backups
      tmpBucket: gitlab-lab-home-backup-tmp

  minio:
    enabled: false
  grafana:
    enabled: false

# === GITLAB ===
gitlab:
  upgradeCheck:
    enabled: false
  webservice:
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    deployment:
      livenessProbe:
        initialDelaySeconds: 200   # GitLab долго грузится (1–3 мин)
      readinessProbe:
        initialDelaySeconds: 120
        failureThreshold: 12
    resources:
      requests:
        cpu: 300m
        memory: 2G
      limits:
        cpu: "1"
        memory: 4G   # было 2.5G — OOMKilled при нагрузке
  sidekiq:
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 400m
        memory: 1G
      limits:
        cpu: "1"
        memory: 2G
  gitaly:
    replicas: 1
    persistence:
      storageClass: topolvm-provisioner
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  gitlab-shell:
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  kas:
    enabled: false
  gitlab-exporter:
    enabled: false
  toolbox:
    enabled: true
    backups:
      cron:
        enabled: true
        schedule: "0 2 * * *"   # каждый день в 02:00
        extraArgs: --skip artifacts   # артефакты уже в S3-бакете artifacts
        successfulJobsHistoryLimit: 5
        failedJobsHistoryLimit: 3
        backoffLimit: 2
        restartPolicy: Never
        persistence:
          enabled: true
          size: 2Gi
          storageClass: topolvm-provisioner
          useGenericEphemeralVolume: false
      objectStorage:
        backend: s3
        config:
          secret: gitlab-s3-cfg
          key: s3cmd

# === БАЗЫ ===
postgresql:
  auth:
    username: gitlab
    password: "gitlab123"
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: topolvm-provisioner
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

redis:
  install: true
  architecture: standalone
  master:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: topolvm-provisioner
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  replica:
    replicaCount: 0
