apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-injector-tls
  namespace: vault
  labels:
    app.kubernetes.io/part-of: vault
    app.kubernetes.io/component: injector-tls
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: vault-injector-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - vault-agent-injector-svc
    - vault-agent-injector-svc.vault
    - vault-agent-injector-svc.vault.svc
    - vault-agent-injector-svc.vault.svc.cluster.local
  issuerRef:
    name: lab-home-ca-issuer
    kind: ClusterIssuer
