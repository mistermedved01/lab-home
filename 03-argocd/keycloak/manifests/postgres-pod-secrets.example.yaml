# S3 credentials для Spilo/WAL-G (inject via operator pod_environment_secret).
# Скопировать в postgres-pod-secrets.yaml (gitignored) и заполнить ключи MinIO.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-pod-secrets
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: keycloak
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "<ACCESS_KEY>"
  AWS_SECRET_ACCESS_KEY: "<SECRET_KEY>"
  CLONE_AWS_ACCESS_KEY_ID: "<ACCESS_KEY>"
  CLONE_AWS_SECRET_ACCESS_KEY: "<SECRET_KEY>"
