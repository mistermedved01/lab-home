---
# ArgoCD Application для MinIO Operator
# MinIO Operator - управление MinIO Tenants через CRD
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-operator
  namespace: argocd
  # Финализаторы для корректного удаления
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Источник - Helm chart из официального репозитория MinIO Operator
  source:
    repoURL: https://operator.min.io/
    chart: operator
    targetRevision: "5.0.18"  # Обновлено для исправления проблем с чтением Secret
    helm:
      # Inline values (основные параметры)
      values: |
        # Настройки для MinIO Operator
        namespace: minio-operator
        
        # Включить MinIO Console (веб-интерфейс)
        # Используем значения по умолчанию из Helm chart, которые должны быть правильными
        console:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Ingress для MinIO Operator Console (управление Operator через JWT)
          # ПРИМЕЧАНИЕ: Operator Console требует JWT Token для входа
          # Для входа с Access Key / Secret Key используйте Tenant Console напрямую
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: "selfsigned-issuer"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
              # Аннотация для совместимости со старыми версиями ingress-nginx
              kubernetes.io/ingress.class: nginx
            hosts:
              - minio.lab-home.com
            tls:
              - secretName: minio-console-tls
                hosts:
                  - minio.lab-home.com
        
        # Настройки для MinIO Operator
        # Используем значения по умолчанию из Helm chart для образа operator
        operator:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        
        # Настройки для MinIO KES (Key Encryption Service)
        kes:
          enabled: false  # Отключаем для упрощения в тестовой среде
  
  # Назначение - текущий кластер, namespace minio-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-operator
  
  # Политика синхронизации
  syncPolicy:
    # Автоматическая синхронизация
    automated:
      prune: true      # Удалять ресурсы, которых нет в Git
      selfHeal: true   # Автоматически исправлять отклонения
      allowEmpty: false # Не разрешать пустые синхронизации
    # Автоматическое создание namespace, если его нет
    syncOptions:
      - CreateNamespace=true
      - SkipCRDs=false  # Установить CRDs для MinIO Operator
    # Retry при ошибках
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
