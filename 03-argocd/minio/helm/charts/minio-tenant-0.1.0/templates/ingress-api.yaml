{{- if and .Values.ingress.enabled .Values.ingress.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-tenant-api
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # S3 path-style и большие тела (multipart upload)
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # При доступе по URL с портом (например https://s3.lab-home.com:30443) Host = "s3.lab-home.com:30443" — без этого правило не матчится
    nginx.ingress.kubernetes.io/server-snippet: "server_name ~^s3\\.lab-home\\.com(:[0-9]+)?$;"
    {{- with .Values.ingress.api.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.api.ingressClassName | default .Values.ingress.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.ingress.api.host }}
      secretName: {{ .Values.ingress.api.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.tenant.name }}-hl
                port:
                  number: 9000
{{- end }}
