# MinIO Tenant values для окружения lab-home
# Чарт: helm/charts/minio-tenant-0.1.0

tenant:
  name: minio-tenant
  image: minio/minio:RELEASE.2023-09-04T19-57-37Z
  configurationSecret: storage-configuration
  pools:
    - name: pool-0
      servers: 1
      volumesPerServer: 1
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      volumeClaimTemplate:
        storageClassName: local-path
        size: 10Gi

credentials:
  rootUser: minioadmin
  rootPassword: minioadmin123

ingress:
  enabled: true
  host: minio.lab-home.com
  ingressClassName: nginx
  tlsSecret: minio-tenant-console-tls
  # S3 API — для mc и прочих клиентов снаружи кластера
  api:
    enabled: true
    host: s3.lab-home.com
    ingressClassName: nginx
    tlsSecret: minio-tenant-api-tls
