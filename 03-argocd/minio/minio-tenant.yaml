---
# MinIO Tenant CRD + Secret
# Этот файл хранится в Git и управляется через ArgoCD Application (minio-tenant-app.yaml)
# ArgoCD автоматически применяет этот файл из Git репозитория
# НЕ нужно применять вручную через kubectl apply - ArgoCD это делает автоматически
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio-tenant
  namespace: minio-operator
  labels:
    app: minio
spec:
  # Количество серверов (для standalone используем 1, для distributed минимум 4)
  # Для тестовой среды используем standalone (1 сервер)
  pools:
    - name: pool-0
      servers: 1
      volumesPerServer: 1
      # Ресурсы для MinIO серверов в пуле
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path  # Используем существующий StorageClass
          resources:
            requests:
              storage: 10Gi  # Размер хранилища на сервер
  
  # Configuration для доступа к MinIO (используется вместо credsSecret)
  # Secret должен содержать config.env с MINIO_ROOT_USER и MINIO_ROOT_PASSWORD
  configuration:
    name: storage-configuration
  
  # Настройки для MinIO сервера
  # Используем версию 2023 для совместимости со старыми CPU (без x86-64-v2)
  image: minio/minio:RELEASE.2023-09-04T19-57-37Z
  
  # Настройки для экспорта сервисов (вместо spec.service)
  exposeServices:
    minio: true  # Внутренний Service для S3 API
    console: true  # Внутренний Service для Console (если нужен)
  
  # Настройки для KES (Key Encryption Service) - опционально
  # Отключаем KES для упрощения в тестовой среде
  # kes:
  #   image: minio/kes:v0.24.0
  #   replicas: 0

---
# Secret для configuration (должен быть создан ДО создания Tenant)
# Использует формат config.env с переменными окружения
# ВАЖНО: Это правильный формат для MinIO Operator - используйте configuration вместо credsSecret
apiVersion: v1
kind: Secret
metadata:
  name: storage-configuration
  namespace: minio-operator
type: Opaque
stringData:
  config.env: |-
    export MINIO_ROOT_USER=minioadmin
    export MINIO_ROOT_PASSWORD=minioadmin123
    export MINIO_BROWSER=on
    # Примечание: В production используйте безопасные пароли!
