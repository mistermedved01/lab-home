---
# ArgoCD Application для MinIO Operator
# Структура как в harbor/vault: локальный чарт + custom-values
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/mistermedved01/lab-home.git
    path: 03-argocd/minio/helm/charts/operator-5.0.18
    targetRevision: main
    helm:
      releaseName: minio-operator
      valueFiles:
        - ../../custom-values/lab-home-operator.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: minio-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - SkipCRDs=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
