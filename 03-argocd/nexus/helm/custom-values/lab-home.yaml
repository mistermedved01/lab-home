# Nexus Repository Manager — values для окружения lab-home
# Чарт: helm/charts/nexus-repository-manager-64.2.0

fullnameOverride: nexus

# Ingress с TLS (cert-manager) — как Harbor: ClusterIssuer выпускает Secret nexus-tls
ingress:
  enabled: true
  ingressClassName: nginx
  hostPath: /
  hostRepo: nexus.lab-home.com
  annotations:
    cert-manager.io/cluster-issuer: "lab-home-ca-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  tls:
    - secretName: nexus-tls
      hosts:
        - nexus.lab-home.com

# TopolVM — том бэкапится Velero (не hostPath). 20Gi: hosted/proxy-репозитории + кэш образов
persistence:
  enabled: true
  storageClass: topolvm-provisioner
  storageSize: 20Gi

# Ресурсы контейнера Nexus
nexus:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
