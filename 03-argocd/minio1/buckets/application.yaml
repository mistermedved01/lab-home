---
# ArgoCD Application для MinIO Buckets
# Управляет buckets через GitOps
# ПРИМЕЧАНИЕ: BucketRequest CRD недоступен в MinIO Operator v5.0.18
# Этот Application зарезервирован на будущее, когда CRD будет доступен
# 
# Альтернативные способы создания buckets:
# 1. Через MinIO Console (веб-интерфейс)
# 2. Через kubectl exec с mc клиентом
# 3. Через Kubernetes Job с mc
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-buckets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # Синхронизировать после tenant (wave 1)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Источник - репозиторий Git с манифестами Buckets
  source:
    repoURL: https://github.com/mistermedved01/lab-home.git
    targetRevision: HEAD
    path: 03-argocd/minio1/buckets
    directory:
      recurse: false
      # Когда BucketRequest CRD станет доступен, раскомментируйте:
      # include: "*.yaml"
  
  # Назначение - текущий кластер, namespace minio-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-operator
  
  # Политика синхронизации
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true  # Разрешаем пустые синхронизации пока CRD недоступен
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
