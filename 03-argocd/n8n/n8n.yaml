---
# ArgoCD Application для n8n
# n8n - workflow automation и интеграции
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Источник - Kustomize из Git репозитория
  source:
    repoURL: https://github.com/mistermedved01/lab-home.git
    targetRevision: HEAD
    path: 03-argocd/n8n

  # Назначение - текущий кластер, namespace n8n
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n

  # Политика синхронизации
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
