---
- name: Присоединение worker нод к Kubernetes
  hosts: kube_node
  become: yes
  gather_facts: yes

  tasks:
    - name: Проверка, присоединён ли уже worker
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Получение join command с control plane
      command: kubeadm token create --print-join-command --kubeconfig=/home/{{ ansible_user }}/.kube/config
      delegate_to: "{{ groups['kube_control_plane'][0] }}"
      register: join_command
      changed_when: false
      when: not kubelet_conf.stat.exists

    - name: Присоединение worker ноды
      command: "{{ join_command.stdout }}"
      when: not kubelet_conf.stat.exists

    - name: Проверка успешного присоединения
      wait_for:
        path: /etc/kubernetes/kubelet.conf
        state: present
      when: not kubelet_conf.stat.exists

    - name: Готово
      debug:
        msg: "Worker {{ inventory_hostname }} присоединён к кластеру"
      when: kubelet_conf.stat.exists
