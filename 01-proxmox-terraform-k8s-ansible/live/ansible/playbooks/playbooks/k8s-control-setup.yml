---
- name: Инициализация Kubernetes control plane
  hosts: kube_control_plane
  become: yes
  gather_facts: yes

  vars:
    kubeconfig_user_path: "/home/{{ ansible_user }}/.kube/config"

  tasks:
    - name: Проверка, не инициализирован ли уже кластер
      stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Получение IP control plane
      set_fact:
        control_plane_ip: "{{ ansible_default_ipv4.address }}"
      when: not admin_conf.stat.exists

    - name: Инициализация control plane через kubeadm
      command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ control_plane_ip }}
      args:
        creates: /etc/kubernetes/admin.conf
      when: not admin_conf.stat.exists

    - name: Создание директории .kube для пользователя
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Копирование kubeconfig пользователю
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeconfig_user_path }}"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Ожидание доступности API сервера
      wait_for:
        host: "{{ control_plane_ip }}"
        port: 6443
        timeout: 300

    - name: Проверка доступа к кластеру
      command: kubectl get nodes --kubeconfig={{ kubeconfig_user_path }}
      register: kubectl_nodes
      retries: 20
      delay: 10
      until: kubectl_nodes.rc == 0
      changed_when: false

    - name: Получение join command для worker нод
      command: kubeadm token create --print-join-command --kubeconfig={{ kubeconfig_user_path }}
      register: join_command
      changed_when: false

    - name: Сохранение join command локально
      copy:
        content: "{{ join_command.stdout }}"
        dest: "{{ playbook_dir }}/.kubeadm-join-command"
        mode: '0600'
      delegate_to: localhost

    - name: Итог
      debug:
        msg:
          - "Control plane инициализирован"
          - "Join command сохранён в {{ playbook_dir }}/.kubeadm-join-command"
          - "Далее можно ставить CNI и подключать worker ноды"