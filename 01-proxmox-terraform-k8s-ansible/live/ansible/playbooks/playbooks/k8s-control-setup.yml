---
- name: Инициализация Kubernetes control plane
  hosts: kube_control_plane
  become: yes
  gather_facts: yes

  vars:
    join_command_file: "{{ playbook_dir }}/.kubeadm-join-command"
    kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"

  tasks:
    - name: Включение common-setup
      include_tasks: "{{ playbook_dir }}/common-setup.yml"

    - name: Проверка, не инициализирован ли уже кластер
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeconfig_exists

    - name: Получение IP адреса control plane ноды
      set_fact:
        control_plane_ip: "{{ ansible_default_ipv4.address }}"

    - name: Инициализация кластера через kubeadm
      command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ control_plane_ip }}
        --ignore-preflight-errors=Swap
      register: kubeadm_init
      when: not kubeconfig_exists.stat.exists
      changed_when: "'Your Kubernetes control-plane has initialized' in kubeadm_init.stdout"

    - name: Создание директории .kube
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Копирование kubeconfig для пользователя
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeconfig_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
        remote_src: yes

    - name: Установка прав на kubeconfig
      file:
        path: "{{ kubeconfig_path }}"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Получение join command
      command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false
      when: kubeconfig_exists.stat.exists or kubeadm_init.changed

    - name: Сохранение join command в файл
      copy:
        content: "{{ join_command.stdout }}"
        dest: "{{ join_command_file }}"
        mode: '0600'
      delegate_to: localhost
      when: kubeconfig_exists.stat.exists or kubeadm_init.changed

    - name: Ожидание готовности control plane
      wait_for:
        host: "{{ control_plane_ip }}"
        port: 6443
        delay: 10
        timeout: 300
      when: not kubeconfig_exists.stat.exists

    - name: Проверка готовности control plane через kubectl
      command: kubectl get nodes --kubeconfig={{ kubeconfig_path }}
      register: kubectl_nodes
      until: kubectl_nodes.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Вывод информации о кластере
      debug:
        msg:
          - "Kubernetes control plane инициализирован успешно!"
          - "Join command сохранен в: {{ join_command_file }}"
          - "Для присоединения worker nodes используйте: ansible-playbook k8s-worker-setup.yml"

