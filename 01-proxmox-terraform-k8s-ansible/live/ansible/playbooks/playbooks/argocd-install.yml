---
- name: Установка ArgoCD через Helm
  hosts: kube_control_plane
  become: yes
  gather_facts: yes

  vars:
    kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"
    helm_release_name: "argocd"
    helm_namespace: "argocd"
    helm_repo_name: "argo"
    helm_repo_url: "https://argoproj.github.io/argo-helm"
    helm_chart_name: "argo/argo-cd"

  tasks:
    - name: Проверка существования kubeconfig
      stat:
        path: "{{ kubeconfig_path }}"
      register: kubeconfig_file

    - name: Ошибка, если kubeconfig не найден
      fail:
        msg: "kubeconfig не найден. Сначала выполните k8s-control-setup.yml"
      when: not kubeconfig_file.stat.exists

    - name: Получение IP адреса control plane ноды
      set_fact:
        control_plane_ip: "{{ ansible_default_ipv4.address }}"

    - name: Ожидание готовности API сервера (порт 6443)
      wait_for:
        host: "{{ control_plane_ip }}"
        port: 6443
        delay: 10
        timeout: 300

    - name: Проверка доступности API сервера через kubectl
      command: kubectl get nodes --kubeconfig={{ kubeconfig_path }}
      register: api_check
      until: api_check.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Проверка, установлен ли уже Helm
      command: helm version --kubeconfig={{ kubeconfig_path }}
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Ошибка, если Helm не установлен
      fail:
        msg: "Helm не установлен. Сначала выполните helm-install.yml"
      when: helm_check.rc != 0

    - name: Копирование values файла на удаленный хост
      copy:
        src: "/etc/ansible/playbooks/helm/argocd/values.yaml"
        dest: "/tmp/argocd-values.yaml"
        mode: '0644'

    - name: Добавление Helm репозитория ArgoCD
      command: >
        helm repo add {{ helm_repo_name }} {{ helm_repo_url }}
        --kubeconfig={{ kubeconfig_path }}
      register: helm_repo_add
      failed_when: false
      changed_when: "'has been added' in helm_repo_add.stdout or 'already exists' in helm_repo_add.stderr"

    - name: Обновление Helm репозиториев
      command: helm repo update --kubeconfig={{ kubeconfig_path }}
      changed_when: true

    - name: Проверка, установлен ли уже ArgoCD
      command: >
        helm list --namespace {{ helm_namespace }}
        --kubeconfig={{ kubeconfig_path }}
        --output json
      register: helm_list
      failed_when: false
      changed_when: false

    - name: Парсинг списка Helm релизов
      set_fact:
        helm_releases: "{{ (helm_list.stdout | from_json) if helm_list.stdout and helm_list.stdout | trim != '' else [] }}"
      when: helm_list.rc == 0

    - name: Установка пустого списка релизов, если helm list не сработал
      set_fact:
        helm_releases: []
      when: helm_list.rc != 0 or helm_list.stdout is not defined or helm_list.stdout | trim == ''

    - name: Проверка наличия релиза в списке
      set_fact:
        release_exists: "{{ helm_release_name in (helm_releases | map(attribute='name') | list | default([])) }}"

    - name: Проверка статуса Helm релиза (если существует)
      command: >
        helm status {{ helm_release_name }}
        --namespace {{ helm_namespace }}
        --kubeconfig={{ kubeconfig_path }}
      register: helm_status
      failed_when: false
      changed_when: false
      when: release_exists

    - name: Разблокировка Helm релиза через удаление секрета блокировки
      command: >
        kubectl delete secret
        -n {{ helm_namespace }}
        -l owner=helm,name={{ helm_release_name }},status=pending-upgrade
        --kubeconfig={{ kubeconfig_path }}
      register: unlock_secret
      failed_when: false
      changed_when: unlock_secret.rc == 0
      when: release_exists
      ignore_errors: true

    - name: Разблокировка Helm релиза через удаление секрета блокировки (pending-install)
      command: >
        kubectl delete secret
        -n {{ helm_namespace }}
        -l owner=helm,name={{ helm_release_name }},status=pending-install
        --kubeconfig={{ kubeconfig_path }}
      register: unlock_secret_install
      failed_when: false
      changed_when: unlock_secret_install.rc == 0
      when: release_exists
      ignore_errors: true

    - name: Повторная проверка доступности API сервера перед установкой
      command: kubectl get nodes --kubeconfig={{ kubeconfig_path }}
      register: api_check_before_install
      until: api_check_before_install.rc == 0
      retries: 20
      delay: 5
      changed_when: false
      when: not release_exists

    - name: Пауза перед установкой для стабилизации API сервера
      pause:
        seconds: 10
      when: not release_exists

    - name: Установка ArgoCD через Helm (без ожидания готовности)
      command: >
        helm install {{ helm_release_name }} {{ helm_chart_name }}
        --namespace {{ helm_namespace }}
        --create-namespace
        --values /tmp/argocd-values.yaml
        --kubeconfig={{ kubeconfig_path }}
        --wait=false
        --timeout=5m
      register: helm_install
      when: not release_exists
      changed_when: true
      retries: 3
      delay: 20
      until: helm_install.rc == 0
      ignore_errors: true

    - name: Повторная проверка доступности API сервера перед обновлением
      command: kubectl get nodes --kubeconfig={{ kubeconfig_path }}
      register: api_check_before_upgrade
      until: api_check_before_upgrade.rc == 0
      retries: 20
      delay: 5
      changed_when: false
      when: release_exists

    - name: Пауза перед обновлением для стабилизации API сервера
      pause:
        seconds: 10
      when: release_exists

    - name: Обновление ArgoCD через Helm (если уже установлен, без ожидания)
      command: >
        helm upgrade {{ helm_release_name }} {{ helm_chart_name }}
        --namespace {{ helm_namespace }}
        --values /tmp/argocd-values.yaml
        --kubeconfig={{ kubeconfig_path }}
        --wait=false
        --timeout=5m
      register: helm_upgrade
      when: release_exists
      changed_when: true
      retries: 3
      delay: 20
      until: helm_upgrade.rc == 0
      ignore_errors: true

    - name: Ожидание восстановления API сервера после установки
      command: kubectl get nodes --kubeconfig={{ kubeconfig_path }}
      register: api_check_after_install
      until: api_check_after_install.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: helm_install.rc == 0 or helm_upgrade.rc == 0

    - name: Повторная проверка API сервера перед проверкой pods
      command: kubectl get nodes --kubeconfig={{ kubeconfig_path }}
      register: api_check_before_pods
      until: api_check_before_pods.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: api_check_after_install.rc == 0

    - name: Ожидание готовности ArgoCD server pod
      command: >
        kubectl wait --namespace {{ helm_namespace }}
        --for=condition=ready pod
        --selector=app.kubernetes.io/name=argocd-server
        --timeout=300s
        --kubeconfig={{ kubeconfig_path }}
      register: argocd_server_wait
      until: argocd_server_wait.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: api_check_before_pods.rc == 0
      failed_when: false

    - name: Получение статуса ArgoCD pods
      command: kubectl get pods --namespace {{ helm_namespace }} --kubeconfig={{ kubeconfig_path }}
      register: argocd_pods
      changed_when: false
      failed_when: false
      when: api_check_before_pods.rc == 0

    - name: Вывод статуса ArgoCD
      debug:
        msg:
          - "ArgoCD успешно установлен!"
          - "Namespace: {{ helm_namespace }}"
          - "Release: {{ helm_release_name }}"
      when: api_check_before_pods.rc == 0

    - name: Вывод статуса pods
      debug:
        var: argocd_pods.stdout_lines
      when: api_check_before_pods.rc == 0 and argocd_pods.rc == 0

    - name: Предупреждение о недоступности API сервера
      debug:
        msg:
          - "ВНИМАНИЕ: API сервер недоступен после установки ArgoCD"
          - "ArgoCD установлен через Helm, но невозможно проверить статус pods"
          - "Проверьте статус кластера вручную: kubectl get nodes"
          - "После восстановления API сервера проверьте: kubectl get pods -n {{ helm_namespace }}"
      when: api_check_before_pods.rc != 0

    - name: Получение начального пароля администратора
      command: >
        kubectl get secret argocd-initial-admin-secret
        --namespace {{ helm_namespace }}
        --kubeconfig={{ kubeconfig_path }}
        -o jsonpath="{.data.password}"
      register: admin_secret_password
      failed_when: false
      changed_when: false
      when: api_check_before_pods.rc == 0

    - name: Декодирование пароля администратора
      shell: |
        echo "{{ admin_secret_password.stdout }}" | base64 -d
      register: admin_password_decoded
      failed_when: false
      changed_when: false
      when: admin_secret_password.stdout is defined and admin_secret_password.stdout != ""

    - name: Установка декодированного пароля в переменную
      set_fact:
        admin_password: "{{ admin_password_decoded.stdout_lines[0] | default(admin_password_decoded.stdout | default('')) }}"
      when: 
        - admin_secret_password.stdout is defined 
        - admin_secret_password.stdout != ""
        - admin_password_decoded.stdout is defined

    - name: Вывод пароля администратора
      debug:
        msg:
          - "=========================================="
          - "Данные для входа в ArgoCD:"
          - "=========================================="
          - "Логин: admin"
          - "Пароль: {{ admin_password }}"
          - ""
          - "Для доступа через ingress:"
          - "  http://argocd.example.com:30080"
          - ""
          - "Для доступа через port-forward:"
          - "  kubectl port-forward svc/argocd-server -n {{ helm_namespace }} 8080:443"
          - "  Затем откройте: https://localhost:8080"
          - "=========================================="
      when: 
        - api_check_before_pods.rc == 0 
        - admin_secret_password.stdout is defined 
        - admin_secret_password.stdout != ""
        - admin_password is defined
        - admin_password != ""

    - name: Предупреждение, если пароль еще не создан
      debug:
        msg:
          - "Пароль администратора еще не создан."
          - "Подождите несколько секунд и выполните:"
          - "kubectl -n {{ helm_namespace }} get secret argocd-initial-admin-secret -o jsonpath=\"{.data.password}\" | base64 -d"
      when: admin_secret_password.stdout is not defined or admin_secret_password.stdout == ""

    - name: Получение информации о сервисах
      command: kubectl get svc --namespace {{ helm_namespace }} --kubeconfig={{ kubeconfig_path }}
      register: argocd_services
      changed_when: false

    - name: Вывод информации о сервисах
      debug:
        var: argocd_services.stdout_lines

    - name: Удаление временного values файла
      file:
        path: /tmp/argocd-values.yaml
        state: absent

