---
- name: Подготовка всех нод для Kubernetes
  hosts: k8s_cluster
  become: yes
  gather_facts: yes

  tasks:
    - name: Отключение swap
      command: swapoff -a
      changed_when: false
      failed_when: false

    - name: Комментирование swap в /etc/fstab
      lineinfile:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s)'
        line: '\1'
        backrefs: yes
        state: present
      when: ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='device') | list | first is not none

    - name: Загрузка модулей ядра
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Настройка модулей ядра для автозагрузки
      lineinfile:
        path: /etc/modules-load.d/k8s.conf
        line: "{{ item }}"
        create: yes
      loop:
        - overlay
        - br_netfilter

    - name: Настройка sysctl параметров
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: yes
        reload: yes
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Сохранение sysctl параметров
      copy:
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'

    - name: Установка зависимостей
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Добавление GPG ключа Kubernetes
      apt_key:
        url: "{{ kubernetes_apt_key }}"
        state: present

    - name: Добавление Kubernetes apt repository
      apt_repository:
        repo: "{{ kubernetes_apt_repo }}"
        state: present
        filename: kubernetes

    - name: Установка containerd
      apt:
        name: containerd
        state: present
        update_cache: yes

    - name: Создание директории /etc/containerd
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Создание конфигурации containerd
      copy:
        content: |
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
            [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
              SystemdCgroup = true
        dest: /etc/containerd/config.toml
        mode: '0644'
      notify: restart containerd

    - name: Включение и запуск containerd
      systemd:
        name: containerd
        enabled: yes
        state: started

    - name: Обновление списка пакетов
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Установка kubelet, kubeadm, kubectl (последняя доступная версия из репозитория v{{ kubernetes_version | regex_replace('^([0-9]+\\.[0-9]+).*', '\\1') }})
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        allow_downgrade: yes

    - name: Запрет обновлений kubelet через apt
      dpkg_selections:
        name: kubelet
        selection: hold

    - name: Включение и запуск kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

  handlers:
    - name: restart containerd
      systemd:
        name: containerd
        state: restarted

