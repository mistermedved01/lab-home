---
- name: Подготовка нод Kubernetes (kubeadm compatible)
  hosts: k8s_cluster
  become: yes
  gather_facts: yes

  vars:
    kubernetes_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key"
    kubernetes_apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"

  tasks:
    # -------------------------
    # Swap
    # -------------------------
    - name: Отключение swap
      command: swapoff -a
      changed_when: false

    - name: Отключение swap в fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s)'
        replace: '# \1'

    # -------------------------
    # Kernel modules
    # -------------------------
    - name: Загрузка модулей ядра
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Автозагрузка модулей ядра
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    # -------------------------
    # Sysctl
    # -------------------------
    - name: Настройка sysctl для Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Применение sysctl параметров
      command: sysctl --system
      changed_when: false

    # -------------------------
    # Kubernetes repository setup (before containerd to avoid cache issues)
    # -------------------------
    - name: Удаление старого файла репозитория Kubernetes (если есть)
      file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent

    - name: Установка зависимостей APT
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: no

    - name: Создание директории keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Загрузка и обработка GPG ключа Kubernetes 
      shell: |
        curl -fsSL "{{ kubernetes_apt_key_url }}" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        chmod 644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        # Также добавляем в trusted.gpg.d для совместимости с APT
        curl -fsSL "{{ kubernetes_apt_key_url }}" | gpg --dearmor -o /etc/apt/trusted.gpg.d/kubernetes.gpg
        chmod 644 /etc/apt/trusted.gpg.d/kubernetes.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Проверка создания GPG ключа
      stat:
        path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      register: gpg_key_file

    - name: Ошибка, если ключ не создан
      fail:
        msg: "GPG ключ не был создан в /etc/apt/keyrings/kubernetes-apt-keyring.gpg"
      when: not gpg_key_file.stat.exists

    - name: Добавление Kubernetes репозитория
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "{{ kubernetes_apt_repo }}\n"
        mode: '0644'

    - name: Обновление APT кеша после настройки репозитория
      apt:
        update_cache: yes

    # -------------------------
    # Container runtime
    # -------------------------
    - name: Установка containerd
      apt:
        name: containerd
        state: present
        update_cache: no

    - name: Создание директории /etc/containerd
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Генерация дефолтного конфига containerd
      command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Установка конфига containerd
      copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default_config.stdout }}"
        mode: '0644'
      notify: restart containerd

    - name: Включение SystemdCgroup
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: restart containerd

    - name: Включение и запуск containerd
      systemd:
        name: containerd
        enabled: yes
        state: started

    # -------------------------
    # Kubernetes packages
    # -------------------------

    - name: Установка kubelet, kubeadm, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: no
      register: k8s_packages_install
      retries: 5
      delay: 20
      until: k8s_packages_install is succeeded
      timeout: 900

    - name: Проверка установки пакетов
      command: dpkg -l | grep -E "^ii.*kube(let|adm|ctl)"
      register: k8s_packages_check
      changed_when: false
      failed_when: false

    - name: Вывод информации об установленных пакетах
      debug:
        var: k8s_packages_check.stdout_lines
      when: k8s_packages_check.rc == 0

    - name: Блокировка обновлений Kubernetes пакетов
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Включение kubelet
      systemd:
        name: kubelet
        enabled: yes

  handlers:
    - name: restart containerd
      systemd:
        name: containerd
        state: restarted