# ArgoCD Project для платформенных компонентов
# Пример конфигурации - будет настроен позже
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform components (Rancher, GitLab, etc.)
  
  # Разрешенные источники
  sourceRepos:
    - '*'
  
  # Разрешенные destinations
  destinations:
    - namespace: '*'
      server: '*'
  
  # Разрешенные кластеры
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

