# ArgoCD Project для бизнес-приложений
# Пример конфигурации - будет настроен позже
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Business applications
  
  # Разрешенные источники
  sourceRepos:
    - '*'
  
  # Разрешенные destinations
  destinations:
    - namespace: '*'
      server: '*'
  
  # Разрешенные кластеры
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

