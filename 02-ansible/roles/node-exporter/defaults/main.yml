---
# Переменные по умолчанию для роли node-exporter
node_exporter_version: "1.7.0"
node_exporter_user: "node_exporter"
node_exporter_group: "node_exporter"
node_exporter_port: 9100
node_exporter_install_dir: "/opt/node_exporter"
node_exporter_binary_path: "{{ node_exporter_install_dir }}/node_exporter"
node_exporter_systemd_service: "node_exporter.service"

# URL для скачивания node_exporter
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"

# Firewall настройки (если используется)
node_exporter_firewall_enabled: false

