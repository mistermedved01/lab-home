---
# Основной файл задач для роли argocd
# Устанавливает ArgoCD через Helm
#
# Примечание о зависимостях:
# Роль имеет dependencies на kubernetes и helm в meta/main.yml, но здесь используются
# include_role с tasks_from для выборочного выполнения только проверок (checks).
# Это необходимо, так как dependencies выполняют main.yml ролей полностью,
# а нам нужны только проверки перед установкой через Helm.

# Общие проверки Kubernetes
- name: Выполнение общих проверок Kubernetes
  ansible.builtin.include_role:
    name: kubernetes
    tasks_from: k8s-checks
  tags:
    - checks
    - k8s

# Проверки Helm
- name: Выполнение общих проверок Helm
  ansible.builtin.include_role:
    name: helm
    tasks_from: checks
  tags:
    - checks
    - helm

# Подготовка Helm репозитория
- name: Копирование values файла на удаленный хост
  ansible.builtin.copy:
    src: "{{ playbooks_dir | default('/etc/ansible/playbooks') }}/argocd/values.yaml"
    dest: "{{ argocd_helm_values_file }}"
    mode: '0644'
  tags:
    - argocd
    - prepare

# Управление Helm репозиторием
- name: Управление Helm репозиторием
  ansible.builtin.include_role:
    name: helm
    tasks_from: repo
  vars:
    helm_repo_name: "{{ argocd_helm_repo_name }}"
    helm_repo_url: "{{ argocd_helm_repo_url }}"
  tags:
    - helm
    - repo

# Проверка существования релиза
- name: Проверка Helm релиза
  ansible.builtin.include_role:
    name: helm
    tasks_from: release-checks
  vars:
    helm_release_name: "{{ argocd_helm_release_name }}"
    helm_namespace: "{{ argocd_helm_namespace }}"
  tags:
    - helm
    - checks

# Установка или обновление ArgoCD
- name: Установка или обновление Helm релиза
  ansible.builtin.include_role:
    name: helm
    tasks_from: install-upgrade
  vars:
    helm_release_name: "{{ argocd_helm_release_name }}"
    helm_chart_name: "{{ argocd_helm_chart_name }}"
    helm_namespace: "{{ argocd_helm_namespace }}"
    helm_values_file: "{{ argocd_helm_values_file }}"
    helm_extra_args: "--set server.ingress.hosts[0]={{ argocd_domain }}"
    # --force-conflicts при upgrade обходит конфликт SSA (applicationset-controller env NAMESPACE)
    helm_upgrade_extra_args: "--force-conflicts"
  tags:
    - helm
    - install
    - upgrade

# Обновление ingress через общие tasks
- name: Обновление ingress ArgoCD
  ansible.builtin.include_tasks: ingress.yml
  when: api_check_before_pods is defined and api_check_before_pods.rc is defined and api_check_before_pods.rc == 0
  tags:
    - argocd
    - ingress

# Ожидание готовности ArgoCD
- name: Ожидание готовности pods
  ansible.builtin.include_role:
    name: helm
    tasks_from: wait-for-pods
  vars:
    helm_namespace: "{{ argocd_helm_namespace }}"
    pod_selector: "{{ argocd_pod_selector }}"
  when: api_check_before_pods is defined and api_check_before_pods.rc is defined and api_check_before_pods.rc == 0
  tags:
    - argocd
    - wait

# Вывод статуса
- name: Вывод информации о релизе
  ansible.builtin.include_role:
    name: helm
    tasks_from: status-info
  vars:
    helm_namespace: "{{ argocd_helm_namespace }}"
    helm_release_name: "{{ argocd_helm_release_name }}"
    release_name: "{{ argocd_release_name }}"
  when: api_check_before_pods is defined and api_check_before_pods.rc is defined and api_check_before_pods.rc == 0
  tags:
    - helm
    - status

# Вывод информации о доступе к ArgoCD
- name: Вывод информации о доступе к ArgoCD
  ansible.builtin.include_tasks: info.yml
  when: api_check_before_pods is defined and api_check_before_pods.rc is defined and api_check_before_pods.rc == 0
  tags:
    - argocd
    - info

# Очистка
- name: Удаление временного values файла
  ansible.builtin.file:
    path: "{{ argocd_helm_values_file }}"
    state: absent
  tags:
    - cleanup

