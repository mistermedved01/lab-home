---
galaxy_info:
  author: lab-home
  description: |
    Helm package manager installation and management role.
    Provides reusable tasks for:
    - Helm installation (install)
    - Helm checks (checks)
    - Repository management (repo)
    - Release checks (release-checks)
    - Install/upgrade operations (install-upgrade)
    - Pod readiness waiting (wait-for-pods)
    - Status information (status-info)
    This role is designed to be used via include_role with tasks_from.
  license: MIT
  min_ansible_version: "2.9"
  platforms:
    - name: Ubuntu
      versions:
        - focal
        - jammy

dependencies: []

