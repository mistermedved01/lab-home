# ArgoCD Helm Chart Values
# Документация: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
# Чарт 9.x: global.domain + server.ingress.hostname (не hosts[])

global:
  domain: argocd.lab-home.com

# Настройки сервера ArgoCD
server:
  # Количество реплик
  replicas: 1
  # Метрики Prometheus и ServiceMonitor для Grafana
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # Настройки ingress (требует ingress-nginx)
  ingress:
    enabled: true
    ingressClassName: nginx
    # Домен: argocd_domain в group_vars; переопределяется --set в playbook
    hostname: argocd.lab-home.com
    # TLS на ingress (cert-manager → Secret argocd-server-tls)
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: "lab-home-ca-issuer"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # TLS терминируется на ingress; pod слушает HTTP (server.insecure)
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

  # Ресурсы
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Настройки контроллера
controller:
  replicas: 1
  # Метрики Prometheus и ServiceMonitor для Grafana
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Настройки repo server
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Настройки applicationSet controller
applicationSet:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Настройки Redis
redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Insecure на pod: TLS только на ingress (termination), не в argocd-server
configs:
  params:
    server.insecure: "true"

